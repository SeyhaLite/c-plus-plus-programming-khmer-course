<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <title>ទំព័រមិនមាន (404) — Khmer C++ Academy</title>
    <script>
      // GitHub Pages SPA redirect: forward the deep path to index.html via query string.
      var segmentCount = 1; // repository subpath: /c-plus-plus-programming-khmer-course/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p style="font-family:sans-serif;padding:2rem">កំពុងបញ្ជូនទៅកាន់ទំព័រដើម… / Redirecting…</p>
  </body>
</html>
