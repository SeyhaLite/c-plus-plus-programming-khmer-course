name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, C++ examples, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (from lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + curriculum + integration + security tests
        run: npm test

      - name: Verify C++ examples with real compiler (g++ 17, C++17)
        run: npm run check:cpp

      - name: Build production site (smoke check)
        run: npm run build
